# ============================================================
# InventarIA API — Configuración principal
# Este archivo SE SUBE a GitHub. No contiene secretos.
# Los valores sensibles vienen de variables de entorno (.env).
# ============================================================

spring.application.name=inventaria-api
# Carga las variables del archivo .env (busca en la carpeta actual y en backend/)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=8080
server.address=0.0.0.0

# ── Base de datos (SQL Server) ───────────────────────────────
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=InventarIA;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ──────────────────────────────────────────
# validate: Hibernate verifica que las entidades coincidan con
# las tablas del script SQL, pero no modifica el esquema.
spring.jpa.hibernate.ddl-auto=validate

# Usar exactamente los nombres de @Table/@Column sin convertir a snake_case.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── JSON (Jackson) ───────────────────────────────────────────
spring.jackson.time-zone=America/Mexico_City
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Subida de archivos (fotos del escáner) ───────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.enabled=true

# ── Cliente de IA (texto y visión) ───────────────────────────
# La clave NUNCA se escribe aquí; viene de la variable IA_API_KEY.
ia.api-key=${IA_API_KEY:}
ia.base-url=${IA_BASE_URL:}
ia.model-texto=${IA_MODEL_TEXTO:}
ia.model-vision=${IA_MODEL_VISION:}
ia.timeout-segundos=20
ia.max-tokens=500

# ── Swagger / OpenAPI ─────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ── Seguridad (Google + JWT propio) ─────────────────────────
app.security.google-client-ids=${GOOGLE_CLIENT_IDS}
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-issuer=inventaria-api
app.security.jwt-expiration-hours=9